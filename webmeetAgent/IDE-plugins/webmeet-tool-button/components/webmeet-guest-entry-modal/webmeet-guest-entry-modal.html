<div class="modal-header">
    <div class="modal-title">Join public room</div>
</div>
<form class="modal-body webmeet-guest-entry-modal" id="webmeetGuestEntryModalForm">
    <div class="webmeet-guest-entry-icon" aria-hidden="true">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 11.5 19.5 14 18 12.5"></path>
            <path d="M19.5 14v-4.5"></path>
        </svg>
    </div>
    <p class="webmeet-guest-entry-copy">Enter the name that other participants will see.</p>
    <label class="webmeet-guest-entry-label" for="webmeetGuestEntryName">Your name</label>
    <input id="webmeetGuestEntryName" class="form-input webmeet-guest-entry-input" type="text"
           autocomplete="name" maxlength="80" required>
    <div id="webmeetGuestEntryStatus" class="webmeet-guest-entry-status" role="status" aria-live="polite"></div>
</form>
<div class="modal-footer modal-actions">
    <button id="webmeetGuestEntrySubmit" type="submit" form="webmeetGuestEntryModalForm"
            class="general-button webmeet-guest-entry-submit">
        Join
    </button>
</div>

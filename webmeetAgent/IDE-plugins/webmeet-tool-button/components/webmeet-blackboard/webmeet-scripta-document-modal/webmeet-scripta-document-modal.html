<form class="webmeet-scripta-document-modal" data-role="form">
    <div class="modal-header">
        <div class="modal-title" data-role="title">SCRIPTA document</div>
        <button type="button" class="close" data-local-action="closeModal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <label data-role="nameField">Document name<input class="form-input" data-role="name" autocomplete="off"></label>
        <label data-role="templateField">Initial template<select class="form-input" data-role="template"><option value="general">General</option><option value="vision">Vision</option><option value="plan">Plan</option></select></label>
        <label data-role="objectiveField">
            <span>Work objective</span>
            <textarea class="form-input" data-role="objective" rows="4" placeholder="Describe the work that Vision or Plan should structure"></textarea>
            <small>Used only to generate a Vision or Plan document.</small>
        </label>
        <label data-role="folderField">Workspace folder<select class="form-input" data-role="folder"><option value="">Room default folder</option></select></label>
        <label data-role="pathField">
            <span>Markdown document (.md)</span>
            <input class="form-input" type="search" data-role="pathSearch" placeholder="Search by file name or folder" autocomplete="off">
            <select class="form-input" data-role="path" size="10"></select>
            <small data-role="pathStatus"></small>
        </label>
        <div class="error-message" data-role="error" hidden></div>
    </div>
    <div class="modal-footer">
        <button type="button" class="gray-button" data-local-action="closeModal">Cancel</button>
        <button type="submit" class="general-button" data-role="submit">Continue</button>
    </div>
</form>

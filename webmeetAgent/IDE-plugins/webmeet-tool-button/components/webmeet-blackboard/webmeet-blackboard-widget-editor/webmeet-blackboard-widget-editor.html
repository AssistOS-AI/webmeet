<form class="webmeet-blackboard-widget-editor" data-role="form">
    <div class="modal-header">
        <div class="modal-header-left">
            <div class="modal-title" data-role="title">Edit widget</div>
        </div>
        <button type="button" class="close" data-local-action="closeModal" aria-label="Close"></button>
    </div>

    <div class="modal-body webmeet-blackboard-editor-body" data-role="body">
        <div class="webmeet-tabs" role="tablist" aria-label="Widget editor sections" data-role="tabs">
            <button type="button" class="webmeet-tab active is-active" role="tab" aria-selected="true" data-role="contentTab" data-tab="content">Content</button>
            <button type="button" class="webmeet-tab" role="tab" aria-selected="false" data-role="settingsTab" data-tab="settings">Settings</button>
        </div>

        <div class="webmeet-blackboard-editor-tab-panel" role="tabpanel" data-role="contentPanel">
            <section class="webmeet-blackboard-editor-section" data-role="textSection" hidden>
                <label class="webmeet-form-field">
                    <span data-role="textLabel">Text</span>
                    <textarea class="form-input" name="text" data-role="text"></textarea>
                </label>
            </section>

            <section class="webmeet-blackboard-editor-section" data-role="choiceSection" hidden>
                <div class="webmeet-form-field webmeet-blackboard-poll-setting" data-role="questionsField" hidden>
                    <span>Questions</span>
                    <div class="webmeet-blackboard-poll-question-list" data-role="questions"></div>
                    <div class="webmeet-blackboard-poll-question-list-actions">
                        <button type="button" class="gray-button webmeet-blackboard-add-question-button" data-role="addQuestion">Add question</button>
                    </div>
                </div>
            </section>

            <section class="webmeet-blackboard-bullets-editor-section" data-role="bulletsSection" hidden>
                <div class="webmeet-blackboard-editor-section">
                    <label class="webmeet-form-field">
                        <span>Title</span>
                        <input class="form-input" name="bulletsTitle" type="text" data-role="bulletsTitle">
                    </label>
                </div>
                <div class="webmeet-form-field">
                    <span>Bullets</span>
                    <template data-role="bulletsItemTemplate">
                        <div class="webmeet-blackboard-bullets-editor-row" data-role="bulletsItemRow">
                            <label class="webmeet-form-field webmeet-blackboard-bullets-editor-text">
                                <textarea class="form-input" rows="1" data-role="bulletsItemText"></textarea>
                            </label>
                            <label class="webmeet-form-field webmeet-blackboard-bullets-editor-select-field">
                                <span>Status</span>
                                <select class="form-input" data-role="bulletsItemStatus" aria-label="Bullet status">
                                    <option value="todo">To Do</option>
                                    <option value="inProgress">In Progress</option>
                                    <option value="done">Done</option>
                                    <option value="blocked">Blocked</option>
                                </select>
                            </label>
                            <label class="webmeet-form-field webmeet-blackboard-bullets-editor-select-field">
                                <span>Priority</span>
                                <select class="form-input" data-role="bulletsItemPriority" aria-label="Bullet priority">
                                    <option value="high">High</option>
                                    <option value="medium">Medium</option>
                                    <option value="low">Low</option>
                                </select>
                            </label>
                            <button type="button" class="gray-button webmeet-blackboard-remove-question-button webmeet-blackboard-bullets-remove-button" title="Remove this bullet">
                                <span class="webmeet-blackboard-bullets-remove-icon" aria-hidden="true"></span>
                            </button>
                        </div>
                    </template>
                    <div class="webmeet-blackboard-bullets-editor-list" data-role="bulletsItems"></div>
                    <div class="webmeet-blackboard-poll-question-list-actions">
                        <button type="button" class="gray-button webmeet-blackboard-add-question-button" data-role="addBulletsItem">Add item</button>
                    </div>
                </div>
            </section>
        </div>

        <div class="webmeet-blackboard-editor-tab-panel" role="tabpanel" data-role="settingsPanel" hidden>
            <section class="webmeet-blackboard-editor-section webmeet-blackboard-poll-settings-section" data-role="pollSettingsSection" hidden>
                <label class="webmeet-form-field">
                    <span>Results</span>
                    <select class="form-input" name="resultsVisibility" data-role="resultsVisibility">
                        <option value="hidden">Hidden</option>
                        <option value="afterSubmit">After submit</option>
                        <option value="afterPoll">After poll</option>
                        <option value="afterClose">After close</option>
                        <option value="moderatorsOnly">Moderators only</option>
                        <option value="public">Public</option>
                    </select>
                </label>
                <label class="webmeet-form-field webmeet-blackboard-poll-setting" data-role="durationField" hidden>
                    <span>Timer seconds</span>
                    <input class="form-input" name="durationSeconds" type="number" min="0" max="86400" step="1" data-role="durationSeconds">
                </label>
                <label class="webmeet-form-field webmeet-blackboard-poll-setting" data-role="allowPollChangeField" hidden>
                    <span>Poll changes</span>
                    <label class="webmeet-toggle-row">
                        <input name="allowPollChange" type="checkbox" data-role="allowPollChange">
                        <span>Allow users to change poll</span>
                    </label>
                </label>
                <label class="webmeet-form-field webmeet-blackboard-poll-setting" data-role="anonymousField" hidden>
                    <span>Privacy</span>
                    <label class="webmeet-toggle-row">
                        <input name="anonymous" type="checkbox" data-role="anonymous">
                        <span>Anonymous participant data</span>
                    </label>
                </label>

            </section>

            <section class="webmeet-blackboard-editor-section webmeet-blackboard-typography-section" data-role="typographySection" hidden>
                <label class="webmeet-form-field">
                    <span>Font</span>
                    <select class="form-input" name="fontFamily" data-role="fontFamily">
                        <option value="Arial">Arial</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Trebuchet MS">Trebuchet MS</option>
                    </select>
                </label>
                <label class="webmeet-form-field">
                    <span>Size</span>
                    <input class="form-input" name="fontSize" type="number" min="8" max="200" step="1" data-role="fontSize">
                </label>
                <label class="webmeet-form-field">
                    <span>Text color</span>
                    <input class="form-input" name="textStyleColor" type="color" data-role="textStyleColor">
                </label>
                <label class="webmeet-form-field webmeet-blackboard-text-toggle-field">
                    <span>Style</span>
                    <span class="webmeet-blackboard-text-toggle-row">
                        <label class="webmeet-toggle-row">
                            <input name="fontBold" type="checkbox" data-role="fontBold">
                            <span>Bold</span>
                        </label>
                        <label class="webmeet-toggle-row">
                            <input name="fontItalic" type="checkbox" data-role="fontItalic">
                            <span>Italic</span>
                        </label>
                    </span>
                </label>
            </section>

            <section class="webmeet-blackboard-editor-section" data-role="lineSection" hidden>
                <label class="webmeet-form-field">
                    <span>Arrow</span>
                    <select class="form-input" name="lineMarker" data-role="lineMarker">
                        <option value="none">None</option>
                        <option value="end">End</option>
                        <option value="start">Start</option>
                        <option value="both">Both</option>
                    </select>
                </label>
            </section>

            <section class="webmeet-blackboard-editor-section" data-role="surfaceSection" hidden>
                <label class="webmeet-form-field" data-role="fillField">
                    <span>Background</span>
                    <span class="webmeet-blackboard-fill-control">
                        <input class="form-input" name="fill" type="color" data-role="fill">
                        <label class="webmeet-toggle-row">
                            <input name="fillTransparent" type="checkbox" data-role="fillTransparent">
                            <span>Transparent</span>
                        </label>
                    </span>
                </label>
                <label class="webmeet-form-field">
                    <span data-role="strokeLabel">Border</span>
                    <input class="form-input" name="stroke" type="color" data-role="stroke">
                </label>
                <label class="webmeet-form-field">
                    <span data-role="strokeWidthLabel">Border width</span>
                    <input class="form-input" name="strokeWidth" type="number" min="0" max="24" step="1" data-role="strokeWidth">
                </label>
                <label class="webmeet-form-field" data-role="textColorField" hidden>
                    <span>Text color</span>
                    <input class="form-input" name="textColor" type="color" data-role="textColor">
                </label>
            </section>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="gray-button" data-local-action="closeModal">Cancel</button>
        <button type="submit" class="general-button">Save</button>
    </div>
</form>

<form class="webmeet-blackboard-widget-editor" data-role="form">
    <div class="modal-header">
        <div class="modal-header-left">
            <div class="modal-title" data-role="title">Widget settings</div>
            <div class="modal-subtitle" data-role="subtitle"></div>
        </div>
        <button type="button" class="close" data-local-action="closeModal" aria-label="Close"></button>
    </div>

    <div class="modal-body webmeet-blackboard-editor-body">
        <section class="webmeet-blackboard-editor-section" data-role="textSection" hidden>
            <label class="webmeet-blackboard-editor-field">
                <span data-role="textLabel">Text</span>
                <textarea name="text" data-role="text"></textarea>
            </label>
        </section>

        <section class="webmeet-blackboard-editor-section webmeet-blackboard-typography-section" data-role="typographySection" hidden>
            <label class="webmeet-blackboard-editor-field">
                <span>Font</span>
                <select name="fontFamily" data-role="fontFamily">
                    <option value="Arial">Arial</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Trebuchet MS">Trebuchet MS</option>
                </select>
            </label>
            <label class="webmeet-blackboard-editor-field">
                <span>Size</span>
                <input name="fontSize" type="number" min="8" max="200" step="1" data-role="fontSize">
            </label>
            <label class="webmeet-blackboard-editor-field">
                <span>Text color</span>
                <input name="textStyleColor" type="color" data-role="textStyleColor">
            </label>
            <label class="webmeet-blackboard-editor-field webmeet-blackboard-text-toggle-field">
                <span>Style</span>
                <span class="webmeet-blackboard-text-toggle-row">
                    <label class="webmeet-blackboard-text-toggle">
                        <input name="fontBold" type="checkbox" data-role="fontBold">
                        <span>Bold</span>
                    </label>
                    <label class="webmeet-blackboard-text-toggle">
                        <input name="fontItalic" type="checkbox" data-role="fontItalic">
                        <span>Italic</span>
                    </label>
                </span>
            </label>
        </section>

        <section class="webmeet-blackboard-editor-section" data-role="choiceSection" hidden>
            <label class="webmeet-blackboard-editor-field">
                <span>Options</span>
                <input name="options" data-role="options" autocomplete="off">
            </label>
            <label class="webmeet-blackboard-editor-field">
                <span>Results</span>
                <select name="resultsVisibility" data-role="resultsVisibility">
                    <option value="hidden">Hidden</option>
                    <option value="afterSubmit">After submit</option>
                    <option value="afterVote">After vote</option>
                    <option value="afterClose">After close</option>
                    <option value="moderatorsOnly">Moderators only</option>
                    <option value="public">Public</option>
                </select>
            </label>
        </section>

        <section class="webmeet-blackboard-editor-section" data-role="lineSection" hidden>
            <label class="webmeet-blackboard-editor-field">
                <span>Arrow</span>
                <select name="lineMarker" data-role="lineMarker">
                    <option value="none">None</option>
                    <option value="end">End</option>
                    <option value="start">Start</option>
                    <option value="both">Both</option>
                </select>
            </label>
        </section>

        <section class="webmeet-blackboard-editor-section" data-role="surfaceSection" hidden>
            <label class="webmeet-blackboard-editor-field" data-role="fillField">
                <span>Background</span>
                <span class="webmeet-blackboard-fill-control">
                    <input name="fill" type="color" data-role="fill">
                    <label class="webmeet-blackboard-transparent-control">
                        <input name="fillTransparent" type="checkbox" data-role="fillTransparent">
                        <span>Transparent</span>
                    </label>
                </span>
            </label>
            <label class="webmeet-blackboard-editor-field">
                <span data-role="strokeLabel">Border</span>
                <input name="stroke" type="color" data-role="stroke">
            </label>
            <label class="webmeet-blackboard-editor-field">
                <span data-role="strokeWidthLabel">Border width</span>
                <input name="strokeWidth" type="number" min="0" max="24" step="1" data-role="strokeWidth">
            </label>
            <label class="webmeet-blackboard-editor-field" data-role="textColorField" hidden>
                <span>Text color</span>
                <input name="textColor" type="color" data-role="textColor">
            </label>
        </section>
    </div>

    <div class="modal-footer">
        <button type="button" class="gray-button" data-local-action="closeModal">Cancel</button>
        <button type="submit" class="general-button">Save</button>
    </div>
</form>

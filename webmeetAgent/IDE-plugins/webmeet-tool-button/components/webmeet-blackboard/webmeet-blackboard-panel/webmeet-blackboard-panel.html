<webmeet-blackboard-toolbar data-presenter="webmeet-blackboard-toolbar"></webmeet-blackboard-toolbar>
<webmeet-blackboard-results-panel data-presenter="webmeet-blackboard-results-panel" hidden></webmeet-blackboard-results-panel>

<nav class="webmeet-blackboard-workspace-nav" aria-label="Blackboard workspaces">
    <div class="webmeet-blackboard-tabs" data-role="workspace-tabs" role="tablist" aria-label="Workspace zones"></div>
    <button type="button" class="webmeet-blackboard-workspace-button" data-local-action="createWorkspaceBoard" title="New workspace" aria-label="New workspace">+</button>
    <button type="button" class="webmeet-blackboard-workspace-button" data-local-action="toggleWorkspaceFilmstrip" title="Show all workspaces" aria-label="Show all workspaces" aria-pressed="false">▤</button>
</nav>

<template data-template="workspace-tab">
    <div class="webmeet-blackboard-tab-shell" draggable="true">
        <button type="button" class="webmeet-blackboard-tab" role="tab" data-local-action="activateWorkspaceBoard" title="Double-click to rename workspace"></button>
        <input type="text" class="webmeet-blackboard-tab-title-input" data-role="workspace-tab-title-input" maxlength="80" aria-label="Workspace name" hidden>
        <button type="button" class="webmeet-blackboard-tab-menu is-delete" data-local-action="deleteWorkspaceBoard" title="Delete workspace" aria-label="Delete workspace">×</button>
    </div>
</template>

<template data-template="workspace-filmstrip-card">
    <article class="webmeet-blackboard-filmstrip-card" tabindex="0">
        <span class="webmeet-blackboard-filmstrip-preview" data-role="filmstrip-preview"></span>
        <button type="button" class="webmeet-blackboard-filmstrip-open" data-local-action="activateFilmstripBoard">
            <span class="webmeet-blackboard-filmstrip-title" data-role="filmstrip-title"></span>
            <span class="webmeet-blackboard-filmstrip-count" data-role="filmstrip-count"></span>
        </button>
    </article>
</template>

<template data-template="workspace-filmstrip-widget">
    <span class="webmeet-blackboard-filmstrip-widget"
          data-role="filmstrip-widget"
          tabindex="0"
          draggable="true">
        <svg class="webmeet-blackboard-filmstrip-shape"
             data-role="filmstrip-shape"
             viewBox="0 0 100 100"
             preserveAspectRatio="none"
             aria-hidden="true"
             hidden>
            <rect data-role="filmstrip-shape-rectangle" x="3" y="3" width="94" height="94"></rect>
            <rect data-role="filmstrip-shape-rounded" x="3" y="3" width="94" height="94" rx="12" ry="12" hidden></rect>
            <ellipse data-role="filmstrip-shape-ellipse" cx="50" cy="50" rx="47" ry="47" hidden></ellipse>
            <polygon data-role="filmstrip-shape-diamond" points="50,3 97,50 50,97 3,50" hidden></polygon>
            <polygon data-role="filmstrip-shape-triangle" points="50,4 96,96 4,96" hidden></polygon>
            <text data-role="filmstrip-shape-label" x="50" y="50" text-anchor="middle" dominant-baseline="middle"></text>
        </svg>
        <svg class="webmeet-blackboard-filmstrip-line"
             data-role="filmstrip-line"
             viewBox="0 0 100 100"
             preserveAspectRatio="none"
             aria-hidden="true"
             hidden>
            <line data-role="filmstrip-line-segment" x1="2" y1="50" x2="98" y2="50"></line>
        </svg>
        <span class="webmeet-blackboard-filmstrip-image-frame" data-role="filmstrip-image-frame" hidden>
            <img class="webmeet-blackboard-filmstrip-image" data-role="filmstrip-image" alt="" draggable="false">
        </span>
        <span class="webmeet-blackboard-filmstrip-content" data-role="filmstrip-content" hidden>
            <span class="webmeet-blackboard-filmstrip-content-kicker" data-role="filmstrip-content-kicker"></span>
            <strong class="webmeet-blackboard-filmstrip-content-title" data-role="filmstrip-content-title"></strong>
            <span class="webmeet-blackboard-filmstrip-content-text" data-role="filmstrip-content-text"></span>
            <span class="webmeet-blackboard-filmstrip-content-list" data-role="filmstrip-content-list"></span>
        </span>
    </span>
</template>

<template data-template="workspace-filmstrip-list-item">
    <span class="webmeet-blackboard-filmstrip-content-item">
        <span class="webmeet-blackboard-filmstrip-content-bullet" aria-hidden="true"></span>
        <span data-role="filmstrip-content-item-text"></span>
    </span>
</template>

<template data-template="workspace-filmstrip-group">
    <span class="webmeet-blackboard-filmstrip-widget webmeet-blackboard-filmstrip-group"
          data-role="filmstrip-widget"
          data-widget-type="group"
          tabindex="0"
          draggable="true">
        <span class="webmeet-blackboard-filmstrip-group-label" data-role="filmstrip-group-label"></span>
    </span>
</template>

<template data-template="workspace-transfer-ghost">
    <div class="webmeet-blackboard-workspace-transfer-ghost" data-role="workspace-transfer-ghost" aria-hidden="true">
        <span data-role="workspace-transfer-ghost-label"></span>
    </div>
</template>

<template data-template="file-widget">
    <article class="webmeet-blackboard-file-card">
        <span class="webmeet-blackboard-file-extension" data-role="file-extension" aria-hidden="true"></span>
        <span class="webmeet-blackboard-file-details">
            <strong class="webmeet-blackboard-file-name" data-role="file-name"></strong>
            <span class="webmeet-blackboard-file-meta" data-role="file-meta"></span>
        </span>
    </article>
</template>

<template data-template="file-context-download">
    <button type="button"
            class="webmeet-blackboard-context-button download"
            data-local-action="downloadBlackboardFile"
            title="Download file"
            aria-label="Download file">
        <span class="webmeet-blackboard-context-icon download" aria-hidden="true"></span>
    </button>
</template>

<template data-template="connection-anchor">
    <span class="webmeet-blackboard-connection-anchor" aria-hidden="true"></span>
</template>

<div class="webmeet-blackboard-selection-context-menu"
     data-role="selection-context-menu"
     role="menu"
     aria-label="Selection clipboard actions"
     hidden>
    <button type="button"
            class="webmeet-blackboard-selection-context-action"
            data-role="selection-context-copy"
            data-local-action="copyContextSelection"
            role="menuitem">Copy</button>
    <button type="button"
            class="webmeet-blackboard-selection-context-action"
            data-role="selection-context-cut"
            data-local-action="cutContextSelection"
            role="menuitem">Cut</button>
    <span class="webmeet-blackboard-selection-context-separator"
          data-role="selection-context-separator"
          role="separator"></span>
    <button type="button"
            class="webmeet-blackboard-selection-context-action"
            data-role="selection-context-paste"
            data-local-action="pasteContextSelectionHere"
            role="menuitem">Paste here</button>
</div>

<template data-template="scripta-document">
    <article class="webmeet-scripta-document">
        <header class="webmeet-scripta-document-header">
            <div class="webmeet-scripta-meeting-notes-status"
                 data-role="meeting-notes-status"
                 role="status"
                 aria-live="polite"
                 hidden>
                <span class="webmeet-scripta-meeting-notes-indicator" aria-hidden="true"></span>
                <span class="webmeet-scripta-meeting-notes-label" data-role="meeting-notes-status-label"></span>
                <span class="webmeet-scripta-meeting-notes-meta" data-role="meeting-notes-status-meta"></span>
            </div>
            <h2 class="webmeet-scripta-document-title" data-role="document-title"></h2>
            <span class="webmeet-scripta-document-position webmeet-scripta-context-meta"
                  data-role="document-position"
                  hidden></span>
            <button type="button"
                    class="webmeet-blackboard-context-button add webmeet-scripta-header-action"
                    data-local-action="runScriptaLocalAction scripta-chapter-add"
                    title="Add chapter"
                    aria-label="Add chapter">
                <span class="webmeet-scripta-header-action-label">Chapter</span>
                <span class="webmeet-blackboard-context-icon plus" aria-hidden="true"></span>
            </button>
        </header>
        <div data-role="document-content"></div>
    </article>
</template>

<template data-template="scripta-empty">
    <div class="webmeet-scripta-empty">Create or open a SCRIPTA document.</div>
</template>

<template data-template="scripta-chapter">
    <section class="webmeet-scripta-document-chapter">
        <header>
            <div class="webmeet-scripta-chapter-title" data-role="chapter-title-editor">
                <h3 data-role="chapter-title"
                    role="button"
                    tabindex="0"
                    data-local-action="openScriptaChapterTitleEditor"
                    aria-label="Edit chapter title"></h3>
                <div class="webmeet-scripta-chapter-title-edit" data-role="chapter-title-edit" hidden>
                    <input type="text"
                           data-role="chapter-title-input"
                           aria-label="Chapter title"
                           autocomplete="off">
                    <div class="webmeet-scripta-chapter-title-edit-actions">
                        <button type="button"
                                class="webmeet-scripta-title-edit-button is-cancel"
                                data-local-action="cancelScriptaChapterTitleEditor"
                                data-role="chapter-title-cancel">Cancel</button>
                        <button type="button"
                                class="webmeet-scripta-title-edit-button is-save"
                                data-local-action="saveScriptaChapterTitleEditor"
                                data-role="chapter-title-save">Save</button>
                    </div>
                </div>
            </div>
            <div class="webmeet-scripta-inline-actions webmeet-scripta-chapter-actions"
                 aria-label="Chapter actions">
                <button type="button"
                        class="webmeet-blackboard-context-button add webmeet-scripta-labeled-action"
                        data-local-action="runScriptaLocalAction scripta-paragraph-add"
                        title="Add paragraph"
                        aria-label="Add paragraph">
                    <span class="webmeet-scripta-inline-action-label">Paragraph</span>
                    <span class="webmeet-blackboard-context-icon plus" aria-hidden="true"></span>
                </button>
                <button type="button"
                        class="webmeet-blackboard-context-button add webmeet-scripta-labeled-action"
                        data-local-action="insertScriptaChapterImage"
                        title="Add image as paragraph"
                        aria-label="Add image as paragraph">
                    <span class="webmeet-scripta-inline-action-label">Image</span>
                    <span class="webmeet-blackboard-context-icon plus" aria-hidden="true"></span>
                </button>
                <div class="webmeet-scripta-reorder-group" role="group" aria-label="Reorder chapter">
                    <div class="webmeet-scripta-reorder-controls">
                        <button type="button"
                                class="webmeet-blackboard-context-button move-up"
                                data-local-action="runScriptaLocalAction scripta-chapter-move"
                                data-move-direction="up"
                                title="Move chapter up"
                                aria-label="Move chapter up">
                            <span class="webmeet-blackboard-context-icon reorder-up" aria-hidden="true"></span>
                        </button>
                        <button type="button"
                                class="webmeet-blackboard-context-button move-down"
                                data-local-action="runScriptaLocalAction scripta-chapter-move"
                                data-move-direction="down"
                                title="Move chapter down"
                                aria-label="Move chapter down">
                            <span class="webmeet-blackboard-context-icon reorder-down" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
                <button type="button"
                        class="webmeet-blackboard-context-button delete"
                        data-local-action="runScriptaLocalAction scripta-chapter-delete"
                        title="Delete chapter"
                        aria-label="Delete chapter">
                    <span class="webmeet-blackboard-context-icon delete" aria-hidden="true"></span>
                </button>
            </div>
        </header>
        <div data-role="chapter-paragraphs"></div>
    </section>
</template>

<template data-template="scripta-paragraph-card">
    <section class="webmeet-scripta-document-paragraph">
        <button type="button"
                class="webmeet-scripta-paragraph-open"
                data-local-action="runScriptaLocalAction scripta-paragraph-open">
            <p data-role="paragraph-text"></p>
        </button>
        <div class="webmeet-scripta-inline-actions webmeet-scripta-paragraph-actions"
             aria-label="Paragraph actions">
            <button type="button"
                    class="webmeet-blackboard-context-button move-up"
                    data-local-action="runScriptaLocalAction scripta-paragraph-move"
                    data-move-direction="up"
                    title="Move paragraph up"
                    aria-label="Move paragraph up">
                <span class="webmeet-blackboard-context-icon reorder-up" aria-hidden="true"></span>
            </button>
            <button type="button"
                    class="webmeet-blackboard-context-button move-down"
                    data-local-action="runScriptaLocalAction scripta-paragraph-move"
                    data-move-direction="down"
                    title="Move paragraph down"
                    aria-label="Move paragraph down">
                <span class="webmeet-blackboard-context-icon reorder-down" aria-hidden="true"></span>
            </button>
            <button type="button"
                    class="webmeet-blackboard-context-button delete"
                    data-local-action="runScriptaLocalAction scripta-paragraph-delete"
                    title="Delete paragraph"
                    aria-label="Delete paragraph">
                <span class="webmeet-blackboard-context-icon delete" aria-hidden="true"></span>
            </button>
        </div>
    </section>
</template>

<template data-template="scripta-paragraph-mode">
    <nav class="webmeet-scripta-paragraph-nav" aria-label="Paragraph navigation">
        <button type="button"
                class="webmeet-scripta-nav-button is-back"
                data-local-action="runScriptaLocalAction scripta-document-view"
                title="Document"
                aria-label="Document">
            <span class="webmeet-scripta-nav-icon is-back" aria-hidden="true"></span>
            <span class="webmeet-scripta-nav-label">Document</span>
        </button>
        <div class="webmeet-scripta-paragraph-pager">
            <span class="webmeet-scripta-paragraph-pager-label">Paragraph</span>
            <div class="webmeet-scripta-paragraph-pager-controls">
                <button type="button"
                        class="webmeet-scripta-nav-button is-previous"
                        data-local-action="runScriptaLocalAction scripta-paragraph-previous"
                        title="Prev"
                        aria-label="Prev">
                    <span class="webmeet-scripta-nav-icon is-previous" aria-hidden="true"></span>
                    <span class="webmeet-scripta-nav-label">Prev</span>
                </button>
                <button type="button"
                        class="webmeet-scripta-nav-button is-next"
                        data-local-action="runScriptaLocalAction scripta-paragraph-next"
                        title="Next"
                        aria-label="Next">
                    <span class="webmeet-scripta-nav-icon is-next" aria-hidden="true"></span>
                    <span class="webmeet-scripta-nav-label">Next</span>
                </button>
            </div>
        </div>
    </nav>
    <header class="webmeet-scripta-heading">
        <div class="webmeet-scripta-hierarchy">
            <span class="webmeet-scripta-context-title" data-role="chapter-title"></span>
        </div>
    </header>
    <scripta-variants-view data-presenter="scripta-variants-view"
                           data-role="variants-view"></scripta-variants-view>
</template>

<section class="webmeet-blackboard-filmstrip" data-role="workspace-filmstrip" aria-label="All workspaces" hidden>
    <p class="webmeet-blackboard-filmstrip-hint">Drag to move. To copy, focus an item and press Ctrl/Cmd+C, then focus a workspace and press Ctrl/Cmd+V.</p>
    <div class="webmeet-blackboard-filmstrip-track" data-role="workspace-filmstrip-track"></div>
</section>

<div class="webmeet-blackboard-stage" data-role="workspace-stage">
    <div class="webmeet-blackboard-file-drop-overlay" data-role="file-drop-overlay" aria-hidden="true" hidden>
        <strong>Drop files here</strong>
        <span>Each file will also be added to chat.</span>
    </div>
    <div class="webmeet-blackboard-transition-layer" data-role="transition-layer" aria-hidden="true" hidden></div>
    <div class="webmeet-blackboard-board" part="board" data-role="board" role="tabpanel" tabindex="0"></div>
</div>

<div class="webmeet-blackboard-poll-results-modal">
    <div class="modal-header">
        <div class="modal-header-left">
            <div class="modal-title" data-role="title">Poll results</div>
            <div class="modal-subtitle" data-role="subtitle"></div>
        </div>
        <button type="button" class="close" data-local-action="closeModal" aria-label="Close"></button>
    </div>

    <div class="modal-body">
        <div class="webmeet-blackboard-poll-modal-description" data-role="description"></div>
        <div class="webmeet-blackboard-poll-modal-layout" data-role="results"></div>
        <section class="webmeet-blackboard-poll-participants-section" data-role="participantsSection" hidden>
            <div class="webmeet-blackboard-poll-modal-section-title">Participants</div>
            <div data-role="participants"></div>
        </section>
    </div>

    <div class="modal-footer">
        <button type="button" class="general-button" data-local-action="closeModal">Close</button>
    </div>
</div>

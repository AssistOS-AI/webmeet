<div class="webmeet-participant-audio-modal">
    <div class="modal-header">
        <div class="modal-header-left">
            <div class="modal-title">Audio Settings</div>
            <div class="modal-subtitle">$$participantName</div>
        </div>
        <button type="button" class="close" data-local-action="closeModal" aria-label="Close">
            <svg class="close-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>
    <div class="modal-body">
        <p class="webmeet-participant-audio-note">These changes apply only in your browser for this room.</p>
        <label class="webmeet-participant-audio-field" for="webmeetParticipantAudioVolume">
            <span class="webmeet-participant-audio-label">Playback volume</span>
            <div class="webmeet-participant-audio-slider-row">
                <input type="range" id="webmeetParticipantAudioVolume" min="0" max="1" step="0.05" value="$$volume">
                <span class="webmeet-participant-audio-value" data-role="volumeValue">100%</span>
            </div>
        </label>
        <label class="webmeet-participant-audio-toggle">
            <input type="checkbox" data-role="muteInput" $$mutedChecked>
            <span>Mute this participant only for me</span>
        </label>
    </div>
    <div class="modal-footer">
        <button type="button" class="gray-button" data-local-action="resetSettings">Reset</button>
        <button type="button" class="gray-button" data-local-action="closeModal">Cancel</button>
        <button type="button" class="general-button" data-local-action="saveSettings">Save</button>
    </div>
</div>

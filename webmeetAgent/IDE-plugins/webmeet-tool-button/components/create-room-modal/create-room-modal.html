<div class="modal-header">
    <div class="modal-title">Create New Room</div>
    <div class="close" data-local-action="closeModal" aria-label="Close">
        <img class="close-icon" src="./assets/icons/x-mark.svg" alt="close">
    </div>
</div>
<div class="modal-body">
    <div class="form-group">
        <label class="form-label">Room Type</label>
        <div class="room-type-options">
            <label class="room-type-option">
                <input type="radio" name="roomType" value="team" data-id="roomTypeTeam" checked>
                <div class="room-type-card">
                    <div class="room-type-icon">👥</div>
                    <div class="room-type-name">Team Room</div>
                    <div class="room-type-desc">For workspace members only</div>
                </div>
            </label>
            <label class="room-type-option">
                <input type="radio" name="roomType" value="guest" data-id="roomTypeGuest">
                <div class="room-type-card">
                    <div class="room-type-icon">🔗</div>
                    <div class="room-type-name">Guest Room</div>
                    <div class="room-type-desc">Accessible via shareable link</div>
                </div>
            </label>
        </div>
    </div>
    <div class="form-group">
        <label class="form-label" for="roomTitle">Room Title</label>
        <input type="text" id="roomTitle" data-id="roomTitleInput" class="form-input" placeholder="Enter room name..." value="Standup">
    </div>
</div>
<div class="modal-footer">
    <button class="gray-button" data-local-action="closeModal">Cancel</button>
    <button class="general-button" data-local-action="confirmCreate">Create Room</button>
</div>

<div class="webmeet-blackboard-toolbar" part="toolbar">
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="setTool select" title="Select" aria-label="Select">↖</button>
    <span class="webmeet-blackboard-separator" aria-hidden="true"></span>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget shape:rectangle" title="Add rectangle" aria-label="Add rectangle">□</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget shape:ellipse" title="Add ellipse" aria-label="Add ellipse">○</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget shape:diamond" title="Add diamond" aria-label="Add diamond">◇</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget shape:triangle" title="Add triangle" aria-label="Add triangle">△</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget line" title="Add line" aria-label="Add line">／</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget line:arrow-end" title="Add arrow" aria-label="Add arrow">→</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget line:arrow-both" title="Add double arrow" aria-label="Add double arrow">↔</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget text" title="Add text" aria-label="Add text">T</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget quiz" title="Add quiz" aria-label="Add quiz">Q</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget vote" title="Add vote" aria-label="Add vote">V</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="addWidget input" title="Add input" aria-label="Add input">I</button>
    <span class="webmeet-blackboard-separator" aria-hidden="true"></span>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="runToolbarAction delete" title="Delete selected" aria-label="Delete selected">⌫</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="runToolbarAction undo" title="Undo" aria-label="Undo">↶</button>
    <button type="button" class="webmeet-blackboard-tool-button" data-local-action="runToolbarAction redo" title="Redo" aria-label="Redo">↷</button>
    <span class="webmeet-blackboard-separator" aria-hidden="true"></span>
    <label class="webmeet-blackboard-color-control" title="Blackboard background" aria-label="Blackboard background">
        <span>BG</span>
        <input type="color" value="#ffffff" data-background-color>
    </label>
</div>

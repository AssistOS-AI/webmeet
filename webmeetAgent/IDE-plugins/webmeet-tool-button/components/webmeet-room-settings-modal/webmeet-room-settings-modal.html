<div class="webmeet-room-settings-modal">
    <div class="modal-header">
        <div class="modal-header-left">
            <div class="modal-title">Room settings</div>
            <div class="modal-subtitle">$$safeRoomId</div>
        </div>
        <div class="webmeet-room-settings-window-actions">
            <button type="button" class="webmeet-room-settings-window-action-button" aria-label="Toggle fullscreen" title="Toggle fullscreen">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <polyline points="9 21 3 21 3 15"></polyline>
                    <line x1="21" y1="3" x2="14" y2="10"></line>
                    <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
            </button>
            <button type="button" class="close" data-local-action="closeModal" aria-label="Close"></button>
        </div>
    </div>
    <div class="modal-body">
        <div class="webmeet-room-settings-tabs" role="tablist" aria-label="Room settings tabs">
            <button type="button" class="webmeet-room-settings-tab is-active"
                    data-local-action="setRoomSettingsTab" data-room-settings-tab="general"
                    role="tab" aria-controls="roomSettingsGeneralPanel" aria-selected="true">
                General
            </button>
            <button type="button" class="webmeet-room-settings-tab"
                    data-local-action="setRoomSettingsTab" data-room-settings-tab="lifecycle"
                    role="tab" aria-controls="roomSettingsLifecyclePanel" aria-selected="false">
                Lifecycle
            </button>
            <button type="button" class="webmeet-room-settings-tab"
                    data-local-action="setRoomSettingsTab" data-room-settings-tab="roboteam"
                    role="tab" aria-controls="roomSettingsRoboTeamPanel" aria-selected="false">
                Robo team
            </button>
        </div>

        <section id="roomSettingsGeneralPanel" class="webmeet-room-settings-panel"
                 role="tabpanel" data-room-settings-panel="general">
            <label class="webmeet-room-settings-field" for="webmeetRoomSettingsTitle">
                <span>Room name</span>
                <input id="webmeetRoomSettingsTitle" data-role="roomTitleInput" type="text" autocomplete="off">
            </label>

            <div class="webmeet-room-settings-link">
                <div>
                    <span>Room link</span>
                    <code data-role="roomLinkText"></code>
                </div>
                <button type="button" class="gray-button" data-local-action="copyRoomLink" data-role="copyLinkButton">Copy</button>
                <span class="webmeet-room-settings-copy-status" data-role="copyLinkStatus" aria-live="polite"></span>
            </div>
        </section>

        <section id="roomSettingsLifecyclePanel" class="webmeet-room-settings-panel"
                 role="tabpanel" data-room-settings-panel="lifecycle" hidden>
            <div class="webmeet-room-settings-lifecycle-section">
                <h3 class="webmeet-room-settings-section-title">Room lifecycle</h3>
                <p class="webmeet-room-settings-section-description">
                    Archive this room to preserve its history. Archived rooms are read-only and cannot be modified.
                </p>
                <button type="button" class="webmeet-room-settings-archive-button" data-local-action="archiveRoom">
                    Archive room
                </button>
            </div>
            <div class="webmeet-room-settings-lifecycle-section webmeet-room-settings-delete-section">
                <h3 class="webmeet-room-settings-section-title">Permanent deletion</h3>
                <p class="webmeet-room-settings-section-description">
                    Permanently delete this room, including its WebMeet history, participants, agents, and resources.
                    This action cannot be undone.
                </p>
                <button type="button" class="webmeet-room-settings-delete-button" data-local-action="deleteRoom">
                    Delete room
                </button>
            </div>
        </section>

        <section id="roomSettingsRoboTeamPanel" class="webmeet-room-settings-panel"
                 role="tabpanel" data-room-settings-panel="roboteam" hidden>
            <div data-role="roboTeamContent"></div>
        </section>

        <div class="webmeet-room-settings-error" data-role="roomSettingsError" hidden></div>
    </div>
    <div class="modal-footer">
        <button type="button" class="gray-button" data-local-action="closeModal">Cancel</button>
        <button type="button" class="general-button" data-local-action="saveSettings">Save settings</button>
    </div>
</div>
